# vhost for ai-agent-channel behind an existing nginx + Cloudflare. Drop it
# into the reverse proxy's conf.d (http context); the ai-agent-channel
# container must share a docker network with nginx (see
# docker-compose.vps.yml).
#
# Cloudflare SSL mode MUST be "Full (strict)": Cloudflare talks HTTPS to
# this origin and checks its certificate. "Flexible" talks plain HTTP to
# port 80, which below only redirects to HTTPS — a redirect loop.
#
# Lock the origin to Cloudflare, or anyone who finds its IP bypasses every
# edge protection (and the rate limits below see one client per attacker):
#   - allow only Cloudflare's ranges (https://www.cloudflare.com/ips/) in
#     the firewall, or with allow/deny in the 443 server; and/or
#   - Authenticated Origin Pulls: ssl_client_certificate <cloudflare origin
#     pull CA>; ssl_verify_client on;
# Only once the origin is restricted may CF-Connecting-IP be trusted — it is
# a plain request header, and any direct client can set it. Then (and only
# then) enable real_ip so $remote_addr and the limits key on the real client:
#   set_real_ip_from <each Cloudflare range>;
#   real_ip_header CF-Connecting-IP;
#
# Timings: wait_for_reply holds a request for up to 50s, hence a 90s read
# timeout — but under 100s, Cloudflare's default ceiling. Buffering is off:
# MCP streamable HTTP answers with an SSE stream.

# Per-client limits. Agents poll and long-poll, so the rate is generous; the
# point is to stop one client from starving the rest. Tune to your traffic.
limit_req_zone  $binary_remote_addr zone=channel_req:10m  rate=20r/s;
limit_conn_zone $binary_remote_addr zone=channel_conn:10m;

server {
  listen 80;
  server_name channel.example.com;

  # Bearer tokens must never cross the wire in cleartext.
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name channel.example.com;

  # wildcard *.example.com — a shared Cloudflare Origin certificate
  ssl_certificate     /etc/nginx/certs/example.com.crt;
  ssl_certificate_key /etc/nginx/certs/example.com.key;

  # HSTS: browsers keep to HTTPS for this name for a year. `always` sends it
  # on error answers too (401/429), which are most of what a scanner sees.
  # Only if EVERY subdomain of the name serves HTTPS, use instead:
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # (a location with its own add_header drops this one — repeat it there)
  add_header Strict-Transport-Security "max-age=31536000" always;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $channel http://ai-agent-channel:8765;

  # Uploads arrive in chunks well under this; the MCP transport itself
  # rejects bodies over 4 MiB.
  client_max_body_size 8m;
  limit_req  zone=channel_req burst=40 nodelay;
  limit_conn channel_conn 30;   # held long polls count against this
  limit_req_status  429;
  limit_conn_status 429;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  # the app believes this only from a private/loopback peer, i.e. this proxy
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;

  proxy_connect_timeout 5s;
  proxy_send_timeout    90s;
  proxy_read_timeout    90s;
  proxy_buffering       off;

  location / {
    proxy_pass $channel;
  }
}
